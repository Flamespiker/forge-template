# FORGE Stage 0 — Intake and Clarification
#
# Trigger label: intake-ready (applied by the BA/Orchestration Manager once the
# intake spreadsheet is attached to the tracking issue).
# Label lifecycle: removes intake-ready on success. Does not apply
# clarification-pending itself -- intake_agent.py does that (see
# run_intake_agent() in core/agents/intake_agent.py).
# On failure: intake_agent.py posts its own failure comment internally before
# re-raising (see its module docstring / ADR-0011 exception pattern) -- but
# that only covers a failure *inside* intake_agent.py itself. A failure in the
# attachment-download step (before the agent even runs) would otherwise exit
# non-zero with nothing posted to the issue; the final step below covers
# exactly that gap and is skipped entirely when the agent step actually ran
# (success or failure) to avoid ever posting a duplicate.
#
# Stage 0a (Codebase Ingestion, Phase 7 step 7.1) is wired in here too, as a
# conditional step right after "Run Intake Agent" -- NOT as a separate
# workflow. Ingestion doesn't depend on the BA's clarification answers, so
# running it in the same job lets it execute in parallel with the BA's
# clarification round rather than adding a sequential hop after it. See
# docs/FORGE-Phase7-Ingestion-Agent-Spec.md SS2 Fork A. It only fires for
# Enhancement-flagged requests (never Greenfield, Document 07) and is
# genuinely independent of the Intake Agent's own success/failure -- either
# can succeed or fail without masking the other's outcome.

name: FORGE Stage 0 — Intake and Clarification

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    if: github.event.label.name == 'intake-ready'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
      FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
      FORGE_GITHUB_OWNER: Flamespiker
      FORGE_TARGET_REPO: forge-demo-apps
      FORGE_SOURCE_REPO: forge-template
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Guard clause — confirm intake-ready is still present
        id: guard
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import get_issue

          issue = get_issue(int(os.environ["ISSUE_NUMBER"]))
          labels = [l["name"] for l in issue["labels"]]
          proceed = "intake-ready" in labels
          if not proceed:
              print("intake-ready is no longer present on this issue -- skipping run.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Download intake spreadsheet attachment
        id: download
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.workflow_glue download-issue-attachment \
            --issue-number "$ISSUE_NUMBER" \
            --output intake.xlsx \
            --extension .xlsx

      - name: Run Intake Agent
        id: run_agent
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.intake_agent \
            --spreadsheet intake.xlsx \
            --issue-number "$ISSUE_NUMBER"

      - name: Determine Enhancement status and existing service (Stage 0a)
        id: ingestion_decide
        if: always() && steps.guard.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils import file_io

          parsed = file_io.read_xlsx("intake.xlsx")
          request_type_section = parsed["overview"].get("request_type") or {}
          request_type_value = (request_type_section.get("Request Type") or "").strip()
          is_enhancement = request_type_value.lower() == "enhancement"

          existing_service = ""
          request_id = ""
          if is_enhancement:
              for key, value in request_type_section.items():
                  if "existing service name" in key.lower():
                      existing_service = (value or "").strip()
                      break
              if not existing_service:
                  print(
                      "Request Type is 'Enhancement' but 'Existing Service Name' is "
                      "blank -- skipping Ingestion. A human needs to fix the intake "
                      "spreadsheet."
                  )
                  is_enhancement = False
              else:
                  from core.agents.workflow_glue import resolve_request_id
                  request_id = resolve_request_id(int(os.environ["ISSUE_NUMBER"]))

          if not is_enhancement:
              print(f"Request Type = '{request_type_value or '(blank)'}' -- Greenfield or unrecognized, skipping Ingestion.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"is_enhancement={'true' if is_enhancement else 'false'}\n")
              f.write(f"existing_service={existing_service}\n")
              f.write(f"request_id={request_id}\n")
          PY

      - name: Run Ingestion Agent (Stage 0a)
        id: run_ingestion
        if: always() && steps.guard.outputs.proceed == 'true' && steps.ingestion_decide.outputs.is_enhancement == 'true'
        run: |
          python -m core.agents.ingestion_agent \
            --request-id "${{ steps.ingestion_decide.outputs.request_id }}" \
            --existing-service "${{ steps.ingestion_decide.outputs.existing_service }}" \
            --issue-number "$ISSUE_NUMBER"

      - name: Post failure comment for an Ingestion pre-agent step failure
        if: always() && steps.guard.outputs.proceed == 'true' && steps.ingestion_decide.outcome == 'failure'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import post_comment
          post_comment(
              int(os.environ["ISSUE_NUMBER"]),
              "<!-- forge:agent-comment stage=ingestion request_id=unknown -->\n"
              "⚠️ **FORGE Codebase Ingestion (Stage 0a) failed before the Ingestion Agent could run** "
              "(most likely: could not parse the intake spreadsheet's Request Type/Existing Service "
              "Name fields, or could not resolve the request ID). This is scoped to Ingestion only -- "
              "the Intake Agent's own clarifying questions above are unaffected. Check the GitHub "
              "Actions run log for this workflow for the exact error. Requirements/Design will still "
              "run without an existing-architecture summary. An Orchestration Manager should investigate.",
          )
          PY

      - name: Clear intake-ready label
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import remove_label
          remove_label(int(os.environ["ISSUE_NUMBER"]), "intake-ready")
          PY

      - name: Post failure comment for a pre-agent step failure
        if: always() && steps.guard.outputs.proceed == 'true' && steps.run_agent.outcome == 'skipped'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import post_comment
          post_comment(
              int(os.environ["ISSUE_NUMBER"]),
              "⚠️ **FORGE Intake workflow failed before the Intake Agent could run** "
              "(most likely: no intake spreadsheet attachment found on this issue). "
              "Check the GitHub Actions run log for this workflow for the exact error. "
              "An Orchestration Manager needs to investigate before re-applying `intake-ready`.",
          )
          PY
