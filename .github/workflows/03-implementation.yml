# FORGE Stage 3 — Implementation
#
# Trigger label: design-approved (human applies after merging the design PR).
# Label lifecycle: removes design-approved on success (once the feature PR is
# confirmed open -- QA/Security pick up from there via the feature PR event,
# not a label on this issue).
#
# Runs the real Managed Agents coordinator session (ADR-0010) via
# implementation_coordinator.py -- Backend/Frontend/Test Writer subagents on a
# shared sandbox. The job simply waits on the script's own
# poll_until_idle()/run_implementation_stage() call to finish; no separate
# integration-check job is added, since integration handling is native to the
# coordinator (see the Phase 3.4a retrofit notes in CLAUDE.md). timeout-minutes
# below is a safety net for the GitHub Actions runner only -- per the
# documented chat-32 operational incident, killing this *local* process does
# NOT stop the server-side Managed Agents session, which keeps running and can
# be resumed by session ID. A runner timeout here should be treated the same
# way: recover by ID, do not just re-invoke the script.
#
# timeout-minutes raised 60 -> 120 (2026-08-11, REQ-2026-02 incident): real
# Stage 3 runs have taken 37-55 minutes end to end
# (docs/FORGE-pipeline-cost-log.md), and implementation_coordinator.py's own
# completion-wait ceiling (managed_agents_wrapper.py's
# FORGE_IMPLEMENTATION_COMPLETION_TIMEOUT, default 90 min) needs room to
# actually finish -- and, on a genuinely slow run, to post its "still running,
# not failed" comment -- BEFORE this runner-level timeout would kill the
# process out from under it. A 60-minute job timeout left ~5 minutes of
# margin over the largest observed run and none at all over the internal
# wait ceiling; 120 minutes gives the 90-minute internal ceiling ~30 minutes
# of buffer for setup, the commit/PR steps, and Actions runner overhead.
#
# Step 4.9 traceability check (verified by reading the live source, not
# assumed): run_implementation_coordinator() already writes both directions --
# the PR body includes "Related FORGE tracking issue: <owner>/<source_repo>#N"
# (GitHub auto-links this owner/repo#N shorthand), and the tracking-issue
# comment includes the PR's own html_url. Both directions confirmed present in
# core/agents/implementation_coordinator.py as of this wiring pass -- no code
# change was needed for this step, only this confirmation.
#
# On failure inside implementation_coordinator.py itself: it posts its own
# failure comment (same ADR-0011 pattern as every other stage). The final step
# below covers a failure in the still-earlier "Resolve request ID" glue step
# and is skipped entirely once the coordinator actually runs, to avoid ever
# posting a duplicate.

name: FORGE Stage 3 — Implementation

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  implementation:
    if: github.event.label.name == 'design-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
      FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
      FORGE_GITHUB_OWNER: Flamespiker
      FORGE_TARGET_REPO: forge-demo-apps
      FORGE_SOURCE_REPO: forge-template
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Guard clause — confirm design-approved is still present
        id: guard
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import get_issue

          issue = get_issue(int(os.environ["ISSUE_NUMBER"]))
          labels = [l["name"] for l in issue["labels"]]
          proceed = "design-approved" in labels
          if not proceed:
              print("design-approved is no longer present on this issue -- skipping run.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Resolve request ID
        if: steps.guard.outputs.proceed == 'true'
        id: request
        run: |
          python -m core.agents.workflow_glue resolve-request-id --issue-number "$ISSUE_NUMBER"

      - name: Determine Enhancement status and existing service (Item #23)
        id: enhancement_decide
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.workflow_glue download-issue-attachment \
            --issue-number "$ISSUE_NUMBER" \
            --output intake.xlsx \
            --extension .xlsx
          python - <<'PY'
          import os
          from core.agents.utils import file_io

          parsed = file_io.read_xlsx("intake.xlsx")
          request_type_section = parsed["overview"].get("request_type") or {}
          request_type_value = (request_type_section.get("Request Type") or "").strip()
          is_enhancement = request_type_value.lower() == "enhancement"

          existing_service = ""
          if is_enhancement:
              for key, value in request_type_section.items():
                  if "existing service name" in key.lower():
                      existing_service = (value or "").strip()
                      break
              if not existing_service:
                  print(
                      "Request Type is 'Enhancement' but 'Existing Service Name' is "
                      "blank -- treating as Greenfield for Stage 3 (Ingestion Agent's "
                      "own Stage 0a check should already have flagged this at Intake)."
                  )

          if not existing_service:
              print(f"Request Type = '{request_type_value or '(blank)'}' -- Greenfield or unrecognized, no --existing-service flag.")
          else:
              print(f"Enhancement request -- existing service: '{existing_service}'")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"existing_service={existing_service}\n")
          PY

      - name: Run Implementation Coordinator
        id: run_agent
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.implementation_coordinator \
            --issue-number "$ISSUE_NUMBER" \
            --request-id "${{ steps.request.outputs.request_id }}" \
            --existing-service "${{ steps.enhancement_decide.outputs.existing_service }}"

      - name: Clear design-approved label
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import remove_label
          remove_label(int(os.environ["ISSUE_NUMBER"]), "design-approved")
          PY

      - name: Post failure comment for a pre-agent step failure
        if: always() && steps.guard.outputs.proceed == 'true' && steps.run_agent.outcome == 'skipped'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import post_comment
          post_comment(
              int(os.environ["ISSUE_NUMBER"]),
              "⚠️ **FORGE Implementation workflow failed before the Implementation Coordinator "
              "could run** (most likely: could not resolve the request ID, or could not "
              "re-download/parse the intake spreadsheet to determine Enhancement status). "
              "Check the GitHub Actions run log for this workflow for the exact error. An "
              "Orchestration Manager needs to investigate before re-applying `design-approved`.",
          )
          PY
