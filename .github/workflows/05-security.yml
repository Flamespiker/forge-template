# FORGE Stage 5 — Security
#
# Trigger: repository_dispatch type feature-pr-opened, forwarded by
# forge-demo-apps' own .github/workflows/notify-forge.yml -- same mechanism
# and same event as 04-qa.yml (see that file's header comment for the full
# cross-repo-trigger rationale). Runs in parallel with QA, not after it --
# both listen on the same dispatch event independently.
# Label lifecycle: security_agent.py applies security-approved itself on a
# clean scan (see run_security_agent()) -- no label gated this workflow's own
# trigger, so there's nothing to clear on entry, and per Document 6 there is
# no security-loop-back label to clean up on a later pass (unlike QA's retry
# labels) -- a Critical finding leaves the issue with no label at all, by
# design, rather than one that would need clearing later.
# On failure inside security_agent.py itself: it posts its own failure
# comment (same ADR-0011 pattern as every other stage). The final step below
# covers a failure in an earlier glue step (checkout, tool installs) and is
# skipped entirely once the agent step actually runs, to avoid ever posting a
# duplicate. A failure in "Resolve tracking issue number" itself has nowhere
# to post to (that step is what resolves the only issue number we have) --
# the Actions run failing loudly is the fallback signal for that specific case.
#
# Gitleaks is a standalone binary, not a pip package (see CLAUDE.md's Python
# Environment section) -- installed fresh on every run below. Semgrep is in
# requirements.txt already. dotnet/node are set up explicitly (matching
# 04-qa.yml's own pinned versions) for npm audit / dotnet list package
# --vulnerable (Item #52, added 2026-09-05) -- previously this job only
# needed Python.
#
# "Determine Enhancement status and existing service" (Item #25 §2.1) mirrors
# 03-implementation.yml's own Item #24 step exactly -- re-downloads the intake
# spreadsheet to resolve --existing-service, so Security scans the real
# services/<existing_service>/ folder for an Enhancement request instead of
# services/<request_id>/, which Stage 3 never creates for one.

name: FORGE Stage 5 — Security

on:
  repository_dispatch:
    types: [feature-pr-opened]

permissions:
  contents: read
  issues: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
      FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
      FORGE_GITHUB_OWNER: ${{ vars.FORGE_GITHUB_OWNER }}
      FORGE_TARGET_REPO: ${{ vars.FORGE_TARGET_REPO }}
      FORGE_SOURCE_REPO: forge-template
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha }}
      HEAD_REF: ${{ github.event.client_payload.head_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FORGE dependencies
        run: pip install -r requirements.txt

      - name: Guard clause — confirm the PR is still open at this head SHA
        id: guard
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import get_pr

          pr = get_pr(int(os.environ["PR_NUMBER"]))
          proceed = pr["state"] == "open" and pr["head"]["sha"] == os.environ["HEAD_SHA"]
          if not proceed:
              print(f"PR #{pr['number']} state={pr['state']!r} head={pr['head']['sha']!r} -- "
                    f"no longer matches the dispatched event (state=open, head={os.environ['HEAD_SHA']!r}). Skipping.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Resolve tracking issue number
        if: steps.guard.outputs.proceed == 'true'
        id: issue
        run: |
          python -m core.agents.workflow_glue resolve-tracking-issue --pr-number "$PR_NUMBER"

      - name: Resolve request id
        if: steps.guard.outputs.proceed == 'true'
        id: request_id
        run: |
          python -m core.agents.workflow_glue resolve-request-id --issue-number "${{ steps.issue.outputs.issue_number }}"

      - name: Depth check — confirm Pipeline Depth permits Security (Item #43)
        # Shares the "implementation" tier with 03-implementation.yml/
        # 04-qa.yml -- see FORGE-Item43-PipelineDepth-Spec-v3.md §3.
        id: depth
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.workflow_glue check-pipeline-depth \
            --issue-number "${{ steps.issue.outputs.issue_number }}" \
            --request-id "${{ steps.request_id.outputs.request_id }}" \
            --stage implementation

      - name: Determine Enhancement status and existing service (Item #25)
        id: enhancement_decide
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        run: |
          python -m core.agents.workflow_glue download-issue-attachment \
            --issue-number "${{ steps.issue.outputs.issue_number }}" \
            --output intake.xlsx \
            --extension .xlsx \
            --optional
          python - <<'PY'
          import os
          from core.agents.utils import file_io

          existing_service = ""
          request_type_value = ""

          if not os.path.exists("intake.xlsx"):
              print(
                  "No intake spreadsheet attached to this tracking issue -- an ad "
                  "hoc issue, not one created via 00-intake.yml. Treating as "
                  "Greenfield for Security (nothing to check for an Enhancement's "
                  "existing service)."
              )
          else:
              parsed = file_io.read_xlsx("intake.xlsx")
              request_type_section = parsed["overview"].get("request_type") or {}
              request_type_value = (request_type_section.get("Request Type") or "").strip()
              is_enhancement = request_type_value.lower() == "enhancement"

              if is_enhancement:
                  for key, value in request_type_section.items():
                      if "existing service name" in key.lower():
                          existing_service = (value or "").strip()
                          break
                  if not existing_service:
                      print(
                          "Request Type is 'Enhancement' but 'Existing Service Name' is "
                          "blank -- treating as Greenfield for Security (Ingestion Agent's "
                          "own Stage 0a check should already have flagged this at Intake)."
                      )

          if not existing_service:
              print(f"Request Type = '{request_type_value or '(blank)'}' -- Greenfield or unrecognized, no --existing-service flag.")
          else:
              print(f"Enhancement request -- existing service: '{existing_service}'")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"existing_service={existing_service}\n")
          PY

      - name: Generate GitHub App installation token (scoped to the target repo)
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FORGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          owner: ${{ vars.FORGE_GITHUB_OWNER }}
          repositories: ${{ vars.FORGE_TARGET_REPO }}

      - name: Checkout target repo at the PR head commit
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FORGE_GITHUB_OWNER }}/${{ vars.FORGE_TARGET_REPO }}
          ref: ${{ env.HEAD_SHA }}
          token: ${{ steps.app-token.outputs.token }}
          path: monorepo-checkout

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gitleaks
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - uses: actions/setup-dotnet@v4
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        with:
          node-version: '20'

      - name: Run Security Agent
        id: run_agent
        if: steps.guard.outputs.proceed == 'true' && steps.depth.outputs.proceed == 'true'
        run: |
          request_id="${{ steps.request_id.outputs.request_id }}"
          python -m core.agents.security_agent \
            --issue-number "${{ steps.issue.outputs.issue_number }}" \
            --request-id "$request_id" \
            --pr-number "$PR_NUMBER" \
            --repo-path "$GITHUB_WORKSPACE/monorepo-checkout" \
            --existing-service "${{ steps.enhancement_decide.outputs.existing_service }}"

      - name: Post failure comment for a pre-agent step failure
        if: >
          always() && steps.guard.outputs.proceed == 'true' &&
          steps.depth.outputs.proceed == 'true' &&
          steps.issue.outcome == 'success' && steps.run_agent.outcome == 'skipped'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import post_comment
          post_comment(
              int("${{ steps.issue.outputs.issue_number }}"),
              "⚠️ **FORGE Security workflow failed before the Security Agent could run** "
              f"(PR #{os.environ['PR_NUMBER']}, most likely: checkout or tool installation). "
              "Check the GitHub Actions run log for this workflow for the exact error. "
              "An Orchestration Manager needs to investigate.",
          )
          PY
