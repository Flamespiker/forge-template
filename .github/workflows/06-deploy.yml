# FORGE Stage 6 — Deploy (staging only, this phase)
#
# Two triggers, converging on one guard clause (Item #26):
#   1. issues: [labeled] -- fires when qa-approved or security-approved lands
#      on the tracking issue. The realistic sequence (04-qa.yml/05-security.yml
#      gate BEFORE merge) means this trigger almost always finds the feature PR
#      still open -- the guard clause below now requires BOTH labels present
#      AND a confirmed merge before a real Deploy fires, so this trigger alone
#      typically just re-confirms "waiting for merge" and skips cleanly.
#   2. repository_dispatch: [types: pr-merged] -- forwarded by forge-demo-apps'
#      notify-forge.yml the moment the feature PR itself is merged to main.
#      This is what actually fires Deploy in the normal case: QA/Security have
#      already labeled the tracking issue by the time a human merges, so the
#      merge event is the one still-missing condition.
# The guard clause re-checks both conditions (labels + merge) regardless of
# which trigger fired this run -- whichever of "both labels land" or "PR
# merges" happens LAST is what actually triggers a real Deploy. If only one
# condition holds, it's a clean no-op skip (log line, no failure, no posted
# comment), not an error.
#
# Prior behavior (fixed by Item #26): this workflow used to deploy the
# instant both labels landed, regardless of whether the feature PR had been
# merged yet -- deploying an unmerged PR's HEAD commit to staging. Confirmed
# live 2026-08-28 that nothing in the old label-driven trigger chain checked
# merge state at all.
#
# ISSUE_NUMBER resolution differs by trigger: the "issues" trigger carries it
# directly (github.event.issue.number, set at job level below); the
# "repository_dispatch" trigger only carries the merged PR's number/head SHA
# (client_payload.pr_number/head_sha) -- the new "Resolve tracking issue
# number" step below resolves the tracking issue via resolve-tracking-issue
# (same mechanism 04-qa.yml/05-security.yml already use) and exports it to
# $GITHUB_ENV so every later step's existing "$ISSUE_NUMBER" usage works
# unchanged. Same accepted limitation as 04-qa.yml/05-security.yml: a failure
# in that step itself has nowhere to post a comment (it's what resolves the
# only issue number available) -- the Actions run failing loudly is the
# fallback signal for that specific case.
#
# The pr-merged trigger also carries the definitive pr_number/head_sha
# directly (DISPATCH_PR_NUMBER/DISPATCH_HEAD_SHA, job-level env below) -- used
# directly for the checkout and Deploy Agent invocation instead of calling
# resolve-feature-pr, which only ever finds an OPEN PR (confirmed during Item
# #26's own investigation, §1.2) and would find nothing for a PR that's
# already merged/closed.
#
# Deploys against the feature PR's HEAD commit (the branch tip that was
# actually reviewed/approved), not a separate post-merge merge commit --
# consistent with deploy_agent.py's own docstring, which only requires a
# commit SHA to tag the image with.
#
# Label lifecycle: deploy_agent.py applies no label on success (Document 6's
# Label Reference table has no deploy-stage label -- see CLAUDE.md). This
# workflow does not clear qa-approved/security-approved either: they remain
# valid, true statements about this commit even after a successful staging
# deploy, and nothing downstream re-triggers on their continued presence, so
# clearing them would only lose information for no operational benefit.
# On failure inside deploy_agent.py itself: it posts its own failure comment
# (same ADR-0011 pattern as every other stage). The final step below covers a
# failure in an earlier glue step (resolving request_id, checking it out) and
# is skipped entirely once the agent step actually runs, to avoid ever
# posting a duplicate.
#
# "Determine Enhancement status and existing service" (Item #28 §2.1) mirrors
# 03-implementation.yml's own Item #24 step (and 04-qa.yml's/05-security.yml's
# Item #25 step) exactly -- re-downloads the intake spreadsheet to resolve
# --existing-service, so Deploy reads code from the real
# services/<existing_service>/ folder for an Enhancement request instead of
# services/<request_id>/, which Stage 3 never creates for one. By the time
# this step runs, ISSUE_NUMBER is already resolved for either trigger (see
# above) -- no extra request-id/PR resolution needed first.

name: FORGE Stage 6 — Deploy

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [pr-merged]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: >
      github.event_name == 'repository_dispatch' ||
      github.event.label.name == 'qa-approved' ||
      github.event.label.name == 'security-approved'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
      FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
      FORGE_GITHUB_OWNER: ${{ vars.FORGE_GITHUB_OWNER }}
      FORGE_TARGET_REPO: ${{ vars.FORGE_TARGET_REPO }}
      FORGE_SOURCE_REPO: forge-template
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      AZURE_STAGING_CREDENTIALS: ${{ secrets.AZURE_STAGING_CREDENTIALS }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TRIGGER_TYPE: ${{ github.event_name == 'repository_dispatch' && 'pr_merged' || 'labeled' }}
      DISPATCH_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      DISPATCH_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve tracking issue number (pr-merged trigger)
        if: github.event_name == 'repository_dispatch'
        run: |
          python - <<'PY'
          import os
          from core.agents.workflow_glue import resolve_tracking_issue

          issue_number = resolve_tracking_issue(int(os.environ["DISPATCH_PR_NUMBER"]))
          print(f"Resolved tracking issue #{issue_number} for merged PR #{os.environ['DISPATCH_PR_NUMBER']}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ISSUE_NUMBER={issue_number}\n")
          PY

      - name: Guard clause — confirm qa-approved, security-approved, and a confirmed merge
        id: guard
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import get_issue

          issue = get_issue(int(os.environ["ISSUE_NUMBER"]))
          labels = [l["name"] for l in issue["labels"]]
          labels_ok = "qa-approved" in labels and "security-approved" in labels
          merged = os.environ.get("TRIGGER_TYPE") == "pr_merged"
          proceed = labels_ok and merged
          if not proceed:
              if not labels_ok:
                  print(f"Only one gate present so far (labels: {labels}) -- waiting for the other. Skipping this run.")
              else:
                  print(
                      "Both gates present, but this run was triggered by a label event, not "
                      "a confirmed merge -- the feature PR must be merged before Deploy fires "
                      "(Item #26). Skipping this run; the merge itself will re-trigger Deploy "
                      "via the pr-merged dispatch once it happens."
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Resolve request ID
        if: steps.guard.outputs.proceed == 'true'
        id: request
        run: |
          python -m core.agents.workflow_glue resolve-request-id --issue-number "$ISSUE_NUMBER"

      - name: Determine Enhancement status and existing service (Item #28)
        id: enhancement_decide
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.workflow_glue download-issue-attachment \
            --issue-number "$ISSUE_NUMBER" \
            --output intake.xlsx \
            --extension .xlsx
          python - <<'PY'
          import os
          from core.agents.utils import file_io

          parsed = file_io.read_xlsx("intake.xlsx")
          request_type_section = parsed["overview"].get("request_type") or {}
          request_type_value = (request_type_section.get("Request Type") or "").strip()
          is_enhancement = request_type_value.lower() == "enhancement"

          existing_service = ""
          if is_enhancement:
              for key, value in request_type_section.items():
                  if "existing service name" in key.lower():
                      existing_service = (value or "").strip()
                      break
              if not existing_service:
                  print(
                      "Request Type is 'Enhancement' but 'Existing Service Name' is "
                      "blank -- treating as Greenfield for Deploy (Ingestion Agent's own "
                      "Stage 0a check should already have flagged this at Intake)."
                  )

          if not existing_service:
              print(f"Request Type = '{request_type_value or '(blank)'}' -- Greenfield or unrecognized, no --existing-service flag.")
          else:
              print(f"Enhancement request -- existing service: '{existing_service}'")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"existing_service={existing_service}\n")
          PY

      - name: Generate GitHub App installation token (scoped to the target repo)
        if: steps.guard.outputs.proceed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FORGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          owner: ${{ vars.FORGE_GITHUB_OWNER }}
          repositories: ${{ vars.FORGE_TARGET_REPO }}

      - name: Checkout target repo at the feature PR head commit
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FORGE_GITHUB_OWNER }}/${{ vars.FORGE_TARGET_REPO }}
          ref: ${{ env.DISPATCH_HEAD_SHA }}
          token: ${{ steps.app-token.outputs.token }}
          path: monorepo-checkout

      - name: Run Deploy Agent
        id: run_agent
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m core.agents.deploy_agent \
            --issue-number "$ISSUE_NUMBER" \
            --request-id "${{ steps.request.outputs.request_id }}" \
            --repo-path "$GITHUB_WORKSPACE/monorepo-checkout" \
            --commit-sha "$DISPATCH_HEAD_SHA" \
            --pr-number "$DISPATCH_PR_NUMBER" \
            --existing-service "${{ steps.enhancement_decide.outputs.existing_service }}"

      - name: Upload deploy context for post-deploy health check (Item #1)
        # Only runs when "Run Deploy Agent" actually succeeded (the default
        # step condition -- no `if: success()` needed beyond the explicit
        # guard check below). 07-post-deploy-health.yml's workflow_run
        # trigger fires on this job's *conclusion*, which is 'success' both
        # when a real deploy happened AND when the guard clause above
        # skipped cleanly (waiting for the other gate/merge) -- this
        # artifact is how that workflow tells the two apart: no artifact
        # means no real deploy happened this run, and it exits clean. Kept
        # as a separate small step (not folded into deploy_agent.py itself)
        # since run_summary already exists in-process but is discarded on a
        # real run (see deploy_agent.py's own run_deploy_agent -- printed
        # only under --dry-run) -- re-deriving the handful of fields this
        # needs here avoids changing Deploy Agent's own return contract.
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import json
          import os

          context = {
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "request_id": "${{ steps.request.outputs.request_id }}",
              "existing_service": "${{ steps.enhancement_decide.outputs.existing_service }}",
              "commit_sha": os.environ["DISPATCH_HEAD_SHA"],
              "pr_number": int(os.environ["DISPATCH_PR_NUMBER"]),
          }
          with open("deploy-context.json", "w", encoding="utf-8") as f:
              json.dump(context, f)
          print(f"Wrote deploy-context.json: {context}")
          PY

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: deploy-context
          path: deploy-context.json
          retention-days: 7

      - name: Post failure comment for a pre-agent step failure
        if: always() && steps.guard.outputs.proceed == 'true' && steps.run_agent.outcome == 'skipped'
        run: |
          python - <<'PY'
          import os
          from core.agents.utils.github_helper import post_comment
          post_comment(
              int(os.environ["ISSUE_NUMBER"]),
              "⚠️ **FORGE Deploy workflow failed before the Deploy Agent could run** "
              "(most likely: could not resolve the request ID, or an earlier checkout/"
              "setup step failed). Check the GitHub Actions run log for this workflow "
              "for the exact error. An Orchestration Manager needs to investigate.",
          )
          PY
