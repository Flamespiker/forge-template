# Ops-stage PRs (branch ops/<description>) are infrastructure/workflow changes
# (e.g. .github/workflows/* itself) -- they never touch application code, so
# 05-security.yml's real scan never runs against them, same reasoning as
# design-pr-security-noop.yml for design/* PRs. Without this, main's required
# security-check branch protection blocks any ops/* PR forever with "Waiting
# for status to be reported," needing an admin bypass every time (Item #30).
#
# Copy this file as-is to your target monorepo's .github/workflows/ -- unlike
# notify-forge.yml, everything here is self-referential (via GitHub Actions'
# own github.* context) and needs no per-repo edits.
#
# Guard: filtered to ops/* both at the trigger level (job `if:`) and again
# inside the job itself, so this can never fire on a feature/* PR and
# accidentally substitute for a real security scan there.

name: Ops-stage PR security-check (no-op)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  noop-check:
    if: startsWith(github.event.pull_request.head.ref, 'ops/')
    runs-on: ubuntu-latest
    steps:
      - name: Verify head ref is actually ops/* (defense in depth)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            ops/*)
              echo "Head ref '$HEAD_REF' confirmed ops/* -- proceeding."
              ;;
            *)
              echo "Head ref '$HEAD_REF' is NOT ops/* -- refusing to create a no-op security-check. This should be unreachable given the job-level if: guard; failing loudly rather than silently skipping."
              exit 1
              ;;
          esac

      - name: Generate GitHub App installation token (scoped to this repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FORGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create no-op security-check success
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg name "security-check" \
            --arg head_sha "$HEAD_SHA" \
            --arg title "Ops-stage PR -- security scan not applicable" \
            --arg summary "This is an ops-stage PR (branch ops/*) -- it introduces no application code, so the Security Agent's real scan (Semgrep / Gitleaks / GitHub Dependabot) never runs against it. This check was created as a no-op by ops-pr-security-noop.yml solely to satisfy main's required security-check branch protection rule. It is NOT a real scan result -- do not mistake this green check for an actual pass from 05-security.yml." \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "success", output: {title: $title, summary: $summary}}' \
          | gh api "repos/$REPO/check-runs" --input -
