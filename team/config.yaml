# FORGE Team-Layer Configuration
# This file defines team-specific settings for the FORGE automation harness.
# Replace all placeholder values with your project's actual configuration.
#
# Only two things are read from this file at runtime (confirmed by a full
# codebase grep, 2026-09-01 — see backlog Items #36/#37): the `ado:` block
# below (core/agents/utils/ado_helper.py) and `container_apps.staging`
# (core/agents/deploy_agent.py). There is no `container_apps.production`
# block — no production deploy stage exists in code yet (README's own
# stated scope). Every other key this file used to carry (ado_org,
# ado_project, monorepo_name, a top-level area_path/tags, intake_method,
# notification_channel) was dead — read by zero code — and has been
# removed rather than left as a misleading no-op.

ado:
  org_url: "https://dev.azure.com/spike99"
  project: "FORGE-Build"
  area_path: "FORGE-Build"          # default area path — using project root for now, refine later if you add team areas
  default_tags:
    - "forge-managed"

# Azure Container Apps environment configuration for staging deploys.
container_apps:
  staging:
    # The name of the Azure Container Apps environment for staging
    environment: forge-staging
    # The Azure resource group containing the staging Container Apps environment
    resource_group: forge-build-rg
    # Maximum number of replicas; limits cost during low-traffic periods
    max_replicas: 2
    # Minimum replicas set to 0 to allow scale-to-zero when idle
    min_replicas: 0
    # vCPU allocated per replica
    cpu: 0.25
    # Memory allocated per replica
    memory: 0.5Gi
